name: Daily Horizon Summary

on:
  schedule:
    # Run at 06:00 in Hong Kong / Beijing time.
    - cron: '0 6 * * *'
      timezone: "Asia/Hong_Kong"
  workflow_dispatch:

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LWN_KEY: ${{ secrets.LWN_KEY }}
          TZ: Asia/Hong_Kong
          HORIZON_SUMMARY_TZ: Asia/Hong_Kong
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(TZ=Asia/Hong_Kong date +'%Y-%m-%d')" >> "$GITHUB_ENV"

      - name: Commit generated daily summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/_posts
          if git diff --cached --quiet; then
            echo "No daily summary changes to commit."
          else
            git commit -m "Daily Horizon summary: ${DATE}"
            git push
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "Daily Horizon Pages deploy: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
